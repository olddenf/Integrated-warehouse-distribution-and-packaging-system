version: '3.8'

services:
  backend:
    build:
      context: ./project_20260314_212713/projects/saas_warehouse
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./saas_warehouse.db
      - SECRET_KEY=your_secret_key
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - GAODE_API_KEY=your_gaode_api_key
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./saas-warehouse-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  h5:
    build:
      context: ./saas-warehouse-h5
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
